name: 하나은행 환율 갱신

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST: 전날 최종 매매기준율 반영
  workflow_dispatch:       # Actions 탭에서 수동 실행

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-rates.js
      - name: Commit if changed
        run: |
          git add -N cash.json fx 2>/dev/null || true
          if git diff --quiet rates.json cash.json fx; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json cash.json fx
          git commit -m "환율 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
